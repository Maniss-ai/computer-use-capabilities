name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browser-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          version: '0.12.23'
      - run: uv sync --locked --extra dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run --extra dev ruff check src tests scripts
      - run: uv run --extra dev ruff format --check src tests scripts
      - run: uv run --extra dev mypy src
      - run: uv run --extra dev pytest -q --cov=capabilities --cov-report=term-missing
      - run: uv run python scripts/check_submission.py
